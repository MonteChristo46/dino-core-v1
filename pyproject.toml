[project]
name = "dino-core-v1"
version = "0.1.0"
description = "Synthetic anomaly pipeline with PatchCore training — SAM3 masking, DINOv3 clustering, and anomaly detection"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.0.3",
    "matplotlib>=3.10.8",
    "pillow>=12.1.0",
    "pretrainedmodels>=0.7.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.5,<1.7",
    "scipy>=1.17.0",
    "timm>=0.6.0",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "transformers>=4.40.0",
    "umap-learn>=0.5.5",
    "sam2>=1.0.0",
    "sam3 @ git+https://github.com/facebookresearch/sam3.git",
    "einops>=0.8.0",
    "pycocotools>=2.0.0",
    "rfdetr>=1.0.0",
    "cuml-cu12>=25.6.0; sys_platform == 'linux'",
    # pyarrow (via cudf) needs NumPy 2; numba 0.61 caps at <2.3.
    "numpy>=2.0,<2.3",
    "opensimplex>=0.4.5.1",
    "optuna>=3.5.0",
    "optuna-dashboard>=0.17.0",
    # FAISS: GPU build (CUDA 12) on Linux, CPU build on macOS (no GPU wheels
    # exist for darwin). Never install both on one platform — they share the
    # `faiss` module. FaissNN in src/patchcore/common.py auto-falls back to
    # CPU kNN when the CPU build is installed. >=1.14 for NumPy 2 support.
    "faiss-gpu-cu12>=1.14.0; sys_platform == 'linux'",
    "faiss-cpu>=1.14.0; sys_platform == 'darwin'",
    "gradio>=5.36.2",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# sam3 (git) pins numpy<2, but cudf/pyarrow (via cuml) need numpy>=2 and
# numba 0.61 caps at <2.3. Force the intersection; sam3 is not imported by
# the active tiled-PatchCore pipeline (see AGENTS.md) — revert this override
# if sam3 ever breaks on numpy 2.
override-dependencies = ["numpy>=2.0,<2.3"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
