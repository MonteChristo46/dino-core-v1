services:
  triton:
    build:
      context: .
      dockerfile: Dockerfile.triton
      args:
        RUNTIME: cpu
    image: dino-core-triton
    ports:
      - "8003:8000"
      - "8001:8001"
      - "8002:8002"
    volumes:
      - ./model_repository:/models
    command: ["tritonserver", "--model-repository=/models", "--strict-model-config=false", "--backend-config=onnxruntime,enable-shape-inference=false"]
    shm_size: '2g'
